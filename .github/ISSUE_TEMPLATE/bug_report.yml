name: Bug report
description: Something in the code, drafts or intake page does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real personal data** — no names, contact details, identifiers or real
        incident details. Use synthetic values only.
        **Security issues:** do not report them here. Follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal synthetic incident record (JSON) helps. Remove anything real.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. main @ abc1234
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11, Node 22.18, Chrome 140
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real personal data.
          required: true
