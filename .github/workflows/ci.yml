name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (strict compiler checks; see README)
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify source hashes (skips when the PDFs are absent)
        # The source PDFs are not committed and are never downloaded in CI. Exit 2 means
        # "sources not downloaded" and is treated as a clean skip; 1 (mismatch) and 3 fail.
        shell: bash
        run: |
          set +e
          node scripts/verify-sources.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::notice title=Source hashes::Source PDFs are not in the checkout; hash check skipped."
            exit 0
          fi
          exit "$code"

  network-check:
    name: Intake page network check (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Linux job verified green in run 39946544763. Privacy failures now block release.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Network check
        # Uses the Chrome preinstalled on the runner. The Chrome sandbox can be unavailable on
        # Ubuntu runners (user-namespace restrictions), hence CHROME_NO_SANDBOX.
        env:
          CHROME_NO_SANDBOX: "1"
        run: npm run check:network
      - name: Check repository-subpath deployment
        env:
          CHROME_NO_SANDBOX: "1"
          CHECK_BASE_PATH: /dpdp-breach-kit
        run: node scripts/check-network.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          # Pin the scanner image to the same release as the action (the default is "latest").
          version: "3.99.3"
          extra_args: --results=verified,unknown

  pages-build:
    name: Package reviewed demo
    needs: [build, network-check, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload only the static application
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/app

  pages-deploy:
    name: Deploy public practice demo
    needs: pages-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
